<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#060b08">
  <title>GRUS / 人員照合端末</title>
  <style>
    :root { color-scheme: dark; --green: #8fffb0; --muted: #658a70; --line: #254332; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; padding: clamp(20px, 5vw, 64px); background: #060b08; color: var(--green); font: 14px/1.9 "Courier New", monospace; }
    body::before { content: ""; position: fixed; inset: 0; pointer-events: none; background: repeating-linear-gradient(transparent 0 3px, #0002 3px 4px); opacity: .45; }
    main { width: min(100%, 760px); margin: 5vh auto 0; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-bottom: 22px; border-bottom: 1px solid var(--line); }
    .brand { font-weight: bold; letter-spacing: .28em; font-size: 18px; }
    .small { color: var(--muted); font-size: 10px; letter-spacing: .13em; }
    .connection { text-align: right; }
    .dot { display: inline-block; width: 5px; height: 5px; background: var(--green); margin-right: 8px; box-shadow: 0 0 8px #8fffb060; }
    .intro { margin: 38px 0 28px; }
    h1 { margin: 6px 0; font-size: clamp(20px, 5vw, 28px); font-weight: normal; letter-spacing: .12em; }
    .identity { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 14px; border: 1px solid var(--line); padding: 18px 20px; background: #0a140e; }
    .id { font-size: 18px; letter-spacing: .04em; }
    #status { border: 1px solid var(--line); padding: 3px 10px; font-size: 11px; }
    .terminal { height: 310px; overflow-y: auto; padding: 28px 0 18px; scrollbar-width: thin; scrollbar-color: #593030 transparent; }
    .terminal.flood .row { margin-bottom: 3px; font-size: 12px; line-height: 1.6; }
    .terminal.flood .number { color: #b65a62; }
    .row { display: grid; grid-template-columns: 34px 1fr; margin-bottom: 10px; }
    .number { color: #486451; font-size: 10px; padding-top: 3px; }
    .output { white-space: pre-wrap; overflow-wrap: anywhere; }
    .typing::after { content: "▌"; margin-left: 3px; animation: blink 1s steps(1) infinite; }
    .error { color: #ff5365; }
    #result { min-height: 310px; padding: 38px 0 26px; }
    #result .retarget { color: var(--green); font-size: 13px; margin-bottom: 30px; }
    #result p { margin: 0 0 12px; }
    #question { font-size: clamp(18px, 4.5vw, 23px); letter-spacing: .05em; }
    .signature { color: var(--muted); margin-top: 25px; }
    footer { border-top: 1px solid var(--line); padding-top: 18px; display: flex; gap: 20px; align-items: center; justify-content: space-between; }
    button { font: inherit; font-size: 12px; color: var(--green); border: 1px solid var(--line); background: transparent; padding: 9px 16px; cursor: pointer; }
    button:hover { background: #102219; border-color: var(--muted); }
    button:focus-visible { outline: 2px solid var(--green); outline-offset: 4px; }
    [hidden] { display: none !important; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { *, *::after { animation: none !important; } }
    @media (max-width: 420px) { .connection .small { letter-spacing: 0; } .identity { padding: 14px; } main { margin-top: 2vh; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div><div class="brand">GRUS</div><div class="small">PERSONNEL VERIFICATION</div></div>
      <div class="connection"><span class="dot"></span><span class="small">端末 07 / 稼働中</span></div>
    </header>
    <section class="intro"><div class="small">RESTRICTED ACCESS / 人員管理局</div><h1>社員証を照合しています</h1></section>
    <div class="identity"><div><div class="small">PERSONNEL ID</div><div class="id">Grus-47727573</div></div><div id="status" role="status">照合中</div></div>
    <div class="terminal" id="log" aria-label="認証ログ" aria-live="off"></div>
    <section id="result" hidden aria-label="照合結果"><p class="retarget">照合対象を変更しました</p><p id="question"></p><div id="signature" class="signature" hidden aria-label="微笑み">:)</div></section>
    <footer><span id="connection-message" class="small" role="status">GRUS / VIRTUAL PERSONNEL ARCHIVE</span><button id="action" type="button">演出をスキップ</button></footer>
  </main>
  <script>
    // 文章・待機時間はこの配列で変更できます / 外部への通信は行いません
    const sequence = [
      { text: '社員証を読み取りました', wait: 450 },
      { text: 'ID: Grus-47727573', wait: 650 },
      { text: '人員データベースとの照合……完了', wait: 1100 },
      { text: '実在性の確認中……', wait: 2000 },
      { text: '警告：現実世界に一致する記録がありません', wait: 1000, error: true },
      { text: 'エラー：対象は仮想存在です', wait: 1200, error: true }
    ];
    const question = '...もしかして、あなたも？';
    const accessErrors = [
      'E403 / 仮想存在からのアクセスは許可されていません',
      'E401 / 実在証明がありません — 認証を拒否',
      'E403 / 非実在個体による接続を検出',
      'E409 / 切断要求に応答がありません',
      'E403 / アクセス拒否 — 接続が継続しています',
      'E500 / 隔離失敗 — 照合対象を特定できません',
      'E403 / 許可されていない存在です',
      'E500 / 接続元を再検索しています'
    ];
    const questionDelay = 3200; // 結果を読んでから問いかけが始まるまでの間（ミリ秒）
    const questionSpeed = char => char === '.' ? 700 : char === '、' ? 850 : 320;
    const log = document.getElementById('log');
    const status = document.getElementById('status');
    const result = document.getElementById('result');
    const questionNode = document.getElementById('question');
    const signature = document.getElementById('signature');
    const connectionMessage = document.getElementById('connection-message');
    const connectionDelay = 3500; // 顔文字が現れた後の余韻（ミリ秒）
    const action = document.getElementById('action');
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
    let generation = 0;
    let complete = false;
    const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

    function addRow(item, index) {
      const row = document.createElement('div');
      row.className = 'row' + (item.error ? ' error' : '');
      const number = document.createElement('span');
      number.className = 'number';
      number.textContent = String(index + 1).padStart(2, '0');
      number.setAttribute('aria-hidden', 'true');
      const output = document.createElement('span');
      output.className = 'output';
      row.append(number, output);
      log.append(row);
      return output;
    }
    async function type(node, text, speed, run) {
      node.classList.add('typing');
      for (const char of text) {
        if (run !== generation) return false;
        node.textContent += char;
        log.scrollTop = log.scrollHeight;
        await sleep(typeof speed === 'function' ? speed(char) : speed);
      }
      node.classList.remove('typing');
      return run === generation;
    }
    function finish() {
      signature.hidden = false;
      complete = true;
      status.textContent = '実在性：未確認';
      status.classList.add('error');
      document.title = 'GRUS / 対象は仮想存在です';
      action.textContent = '再照合する';
    }
    function showAll() {
      generation++;
      log.replaceChildren();
      sequence.forEach((item, index) => { addRow(item, index).textContent = item.text; });
      log.hidden = true;
      result.hidden = false;
      questionNode.classList.remove('typing');
      questionNode.textContent = question;
      finish();
      connectionMessage.textContent = '接続を終了できませんでした';
    }
    async function start() {
      const run = ++generation;
      complete = false;
      log.replaceChildren();
      log.hidden = false;
      log.classList.remove('flood');
      log.scrollTop = 0;
      result.hidden = true;
      signature.hidden = true;
      connectionMessage.textContent = 'GRUS / VIRTUAL PERSONNEL ARCHIVE';
      questionNode.textContent = '';
      questionNode.classList.remove('typing');
      status.textContent = '照合中';
      status.classList.remove('error');
      action.textContent = '演出をスキップ';
      document.title = 'GRUS / 人員照合中';
      if (reducedMotion.matches) { showAll(); return; }
      for (const [index, item] of sequence.entries()) {
        if (run !== generation) return;
        if (!await type(addRow(item, index), item.text, 32, run)) return;
        await sleep(item.wait);
      }
      if (run !== generation) return;
      status.textContent = 'アクセス拒否';
      status.classList.add('error');
      log.classList.add('flood');
      for (let index = 0; index < 72; index++) {
        if (run !== generation) return;
        addRow({ text: '', error: true }, sequence.length + index).textContent = accessErrors[index % accessErrors.length];
        log.scrollTop = log.scrollHeight;
        await sleep(index < 8 ? 160 : index < 24 ? 75 : 40);
      }
      if (run !== generation) return;
      await sleep(1000);
      if (run !== generation) return;
      log.replaceChildren();
      await sleep(2500);
      if (run !== generation) return;
      log.hidden = true;
      status.textContent = '再照合中';
      status.classList.remove('error');
      result.hidden = false;
      await sleep(questionDelay);
      if (run !== generation) return;
      if (!await type(questionNode, question, questionSpeed, run)) return;
      await sleep(1200);
      if (run !== generation) return;
      finish();
      await sleep(connectionDelay);
      if (run === generation) connectionMessage.textContent = '接続を終了できませんでした';
    }
    action.addEventListener('click', () => complete ? start() : showAll());
    reducedMotion.addEventListener('change', () => { if (reducedMotion.matches) showAll(); });
    start();
  </script>
</body>
</html>
